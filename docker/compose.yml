---
include:
  - compose-lila-ws-${LILA_WS_CONTAINER:-image}.yml
  - compose-search.yml

services:
  openingexplorer:
    # upstream added this WITHOUT a profile (= always started). Opt-in here: this site uses its configured
    # explorer endpoint, and an unprofiled service would start on every `up`. Port loopback-bound like the others
    # (a 0.0.0.0 publication is internet-reachable: docker DNATs before the host's INPUT DROP).
    image: ghcr.io/lichess-org/lila-openingexplorer:latest
    restart: unless-stopped
    profiles:
      - explorer
    ports:
      - 127.0.0.1:9002:9002
    volumes:
      - openingexplorer-data:/app/_db
    environment:
      - LILA_URL=http://caddy
      - EXPLORER_BEARER=lip_openingexplorer
  mongodb:
    image: mongo:7.0.28-jammy
    restart: unless-stopped
    command: mongod --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 2
    stop_grace_period: 60s
    # 2026-10-02: open-files limit 1024 -> 64000 (MongoDB's recommended minimum; mongod logged "Soft rlimits
    # for open file descriptors too low"). With the full 6.2M-puzzle DB, the puzzle-path rebuild exhausted
    # 1024 fds ("Too many open files" -> WiredTiger fassert -> mongod aborted and restarted at 23:35 UTC).
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      test: mongosh --quiet /scripts/replica-set.js
      # 2026-10-02: interval 5s -> 60s. Every check is a new mongosh connection (~4 mongod log lines),
      # so 5s produced ~50k log lines/day. start_interval keeps boot fast: during start_period Docker
      # checks every 5s, so the container still reports healthy within seconds of mongod being up.
      interval: 60s
      timeout: 30s
      start_period: 120s
      start_interval: 5s
      retries: 5
    volumes:
      - ./repos/lila:/lila
      - ./scripts:/scripts
      - mongo_data_primary:/data/db
    profiles:
      - base
  redis:
    image: redis:8.0.3-alpine3.21
    restart: unless-stopped
    volumes:
      - redis_data:/data
    profiles:
      - base
  lila:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: sbt.Dockerfile
    user: ${USER_ID:-}:${GROUP_ID:-}
    working_dir: /lila
    # 2026-10-08: runs the PREBUILT app (sbt-native-packager `stage`) instead of `./lila.sh run`, so no resident
    # sbt server JVM (~3.7 GB). Same JVM options as the app had under sbt run (build.sbt javaOptions), same config
    # file, same logger, same (dev) mode: play.mode is not set. Rebuild after code changes:
    # sudo /usr/local/bin/chess-rebuild-lila.sh (CLAUDE.md "Rebuild lila").
    # The app runs from ./prebuilt/lila/current — a COPY of sbt's stage folder, outside the repo: sbt's stage task
    # deletes whatever it staged last time, and `sbt clean` wipes target/, so the running app must never live there.
    # -Duser.dir=/lila: the native-packager script sets user.dir to its own folder; lila resolves public/ (asset
    # manifest, flairs, bot data) and logs/ relative to it, so pin it to /lila exactly as under sbt run.
    entrypoint: ["/opt/prebuilt/current/bin/lila", "-Duser.dir=/lila", "-Dconfig.file=/lila/conf/application.conf", "-Dlogger.file=/lila/conf/logger.dev.xml"]
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms64m -Xmx2g --enable-native-access=ALL-UNNAMED
      - LILA_DOMAIN=${LILA_DOMAIN:-localhost:8080}
      - LILA_URL=${LILA_URL:-http://localhost:8080}
      - MOCK_EMAIL=${MOCK_EMAIL:-false}
      - MAILER_PASSWORD=${MAILER_PASSWORD}
      - LILA_BPASS_SECRET=${LILA_BPASS_SECRET}
      - LILA_EMAIL_CONFIRM_SECRET=${LILA_EMAIL_CONFIRM_SECRET}
      - LILA_PASSWORD_RESET_SECRET=${LILA_PASSWORD_RESET_SECRET}
      - LILA_EMAIL_CHANGE_SECRET=${LILA_EMAIL_CHANGE_SECRET}
      - LILA_LOGIN_TOKEN_SECRET=${LILA_LOGIN_TOKEN_SECRET}
      - LILA_EXPLORER_OAUTH_TOKEN=${LILA_EXPLORER_OAUTH_TOKEN}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-true}
      - ENABLE_RATE_LIMITING=${ENABLE_RATE_LIMITING:-true}
    volumes:
      - ./repos/lila:/lila
      - ./repos/chessground:/chessground
      - ./repos/pgn-viewer:/pgn-viewer
      - ./repos/bbpPairings:/opt/bbpPairings
      - ./repos/scalachess:/scalachess
      - ./conf/lila.conf:/lila/conf/application.conf
      - ./conf/firebase-service-account.json:/opt/firebase-service-account.json:ro
      - ./prebuilt/lila:/opt/prebuilt:ro
    profiles:
      - base
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      # 2026-09-13: bound to 127.0.0.1 deliberately. Published as 0.0.0.0 these were
      # reachable from the internet: Docker DNATs published ports in PREROUTING, so the
      # packets traverse FORWARD -> DOCKER and the host's "-P INPUT DROP" never applies.
      # Loopback binding means the DNAT rule is never created at all, which is stronger
      # than filtering it in DOCKER-USER. nginx reaches Caddy via 127.0.0.1:8080, and
      # host-originated traffic goes OUTPUT/POSTROUTING so it is unaffected.
      # 9664 (lila_ws) is proxied by NOTHING on the host - nginx sends websockets to
      # 127.0.0.1:8080 and Caddy routes them to lila_ws:9664 inside the docker network -
      # so this publication is vestigial and loopback-binding it changes no traffic path.
      - 127.0.0.1:8080:80
      - 127.0.0.1:9664:9664
    environment:
      - LILA_DOMAIN=${LILA_DOMAIN:-localhost:8080}
      - LILA_URL=${LILA_URL:-http://localhost:8080}
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile
      - ./repos/lila/public:/lila/public
      - ./static:/static
    profiles:
      - base
  mono:
    image: ghcr.io/lichess-org/lila-docker:main
    restart: unless-stopped
    ports:
      - 8080:8080
      - 9664:9664
      - 9664:9664
    environment:
      - LILA_DOMAIN=${LILA_DOMAIN:-localhost:8080}
      - LILA_URL=${LILA_URL:-http://localhost:8080}
    profiles:
      - quick
  api_docs:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: ui.Dockerfile
    working_dir: /api/doc
    entrypoint:
      - /bin/sh
      - -c
      - pnpm install && pnpm dev --host 0.0.0.0
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    ports:
      - 8089:8089
    volumes:
      - ./repos/api:/api
    profiles:
      - api-docs
  chessground:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: ui.Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - pnpm install && pnpm run compile && pnpx http-server -p 8080
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    ports:
      - 8090:8080
    volumes:
      - ./repos/chessground:/app
      - ./.pnpm-store:/.pnpm-store
    profiles:
      - chessground
  pgn_viewer:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: ui.Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - pnpm install && pnpm run demo
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    ports:
      - 8091:8080
    volumes:
      - ./repos/pgn-viewer:/app
      - ./.pnpm-store:/.pnpm-store
    profiles:
      - pgn-viewer
  lila_engine:
    image: rust:1.89.0-trixie  # kept at 1.89 on 2026-10-08: lila-gif/push/engine were not part of the lila upgrade; 1.95 would rebuild them
    working_dir: /lila-engine
    entrypoint: cargo run -- --bind 0.0.0.0:9666 --mongodb mongodb://mongodb
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    environment:
      - LILA_ENGINE_LOG=lila_engine=debug,tower_http=debug
    ports:
      # 2026-09-13: loopback-bound. Published on 0.0.0.0 these were internet-reachable
      # (docker DNATs in PREROUTING, bypassing the host's INPUT DROP policy). Every
      # consumer addresses this service by its docker service name, never the host port.
      - 127.0.0.1:9666:9666
    volumes:
      - ./repos/lila-engine:/lila-engine
    profiles:
      - external-engine
  lila_fishnet:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: sbt.Dockerfile
    user: ${USER_ID:-}:${GROUP_ID:-}
    working_dir: /lila-fishnet
    # 2026-10-08: PREBUILT app (`sbt app/stage`) instead of `sbt app/run` (no resident sbt server JVM, ~1.7 GB).
    # Runs from ./prebuilt/lila-fishnet/current, a copy outside the repo (see lila above).
    entrypoint: ["/opt/prebuilt/current/bin/lila-fishnet"]
    environment:
      - REDIS_HOST=redis
      # - HTTP_API_LOGGER=true
    restart: unless-stopped
    volumes:
      - ./repos/lila-fishnet:/lila-fishnet
      - ./prebuilt/lila-fishnet:/opt/prebuilt:ro
    profiles:
      - stockfish-play
  # 2026-10-08: one-off BUILD containers for the prebuilt apps (profile "build": never started by `up`).
  # Use: docker compose run --rm lila_build   (= ./lila.sh stage)   /   docker compose run --rm lila_fishnet_build
  # These only write sbt's own stage folder in the repo; the running apps use ./prebuilt/<app>/current, which only
  # /usr/local/bin/chess-rebuild-lila.sh updates (copy -> swap, previous build kept as prev -> restart -> verify).
  # lila packages conf/ into its jar: application.conf is a secret-free placeholder here (conf/lila.build.conf);
  # the running app reads the real conf/lila.conf through -Dconfig.file.
  lila_build:
    image: lila-docker-lila
    user: ${USER_ID:-}:${GROUP_ID:-}
    working_dir: /lila
    entrypoint: ["./lila.sh"]
    command: ["stage"]
    volumes:
      - ./repos/lila:/lila
      - ./repos/chessground:/chessground
      - ./repos/pgn-viewer:/pgn-viewer
      - ./repos/bbpPairings:/opt/bbpPairings
      - ./repos/scalachess:/scalachess
      - ./conf/lila.build.conf:/lila/conf/application.conf:ro
    profiles:
      - build
  lila_fishnet_build:
    image: lila-docker-lila_fishnet
    user: ${USER_ID:-}:${GROUP_ID:-}
    working_dir: /lila-fishnet
    entrypoint: ["sbt"]
    command: ["app/stage"]
    volumes:
      - ./repos/lila-fishnet:/lila-fishnet
    profiles:
      - build
  fishnet_play:
    image: niklasf/fishnet:2.15.0
    restart: unless-stopped
    environment:
      - ENDPOINT=http://lila_fishnet:9665/fishnet
      - KEY=fishnetplaydev
      - MAX_BACKOFF=5
      - STATS_FILE=/tmp/stats.json  # fishnet >= 2.15 runs as uid 10001 (not root): / is not writable
    profiles:
      - stockfish-play
  fishnet_analysis:
    image: niklasf/fishnet:2.15.0
    restart: unless-stopped
    environment:
      - ENDPOINT=http://lila:9663/fishnet
      - MAX_BACKOFF=5
      - STATS_FILE=/tmp/stats.json  # fishnet >= 2.15 runs as uid 10001 (not root): / is not writable
    profiles:
      - stockfish-analysis
  python:
    build:
      context: docker
      dockerfile: python.Dockerfile
    volumes:
      - ./repos/berserk:/berserk
      - ./repos/lila-db-seed:/lila-db-seed
      - ./scripts:/scripts
    profiles:
      - utils
  ui:
    build:
      context: docker
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
      dockerfile: ui.Dockerfile
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    environment:
      - CI=1  # to disable pnpm install prompts
    volumes:
      - ./repos/lila:/lila
      - ./repos/chessground:/chessground
      - ./repos/pgn-viewer:/pgn-viewer
      - ./.pnpm-store:/.pnpm-store
    profiles:
      - utils
  lila_gif:
    image: rust:1.89.0-trixie  # kept at 1.89 on 2026-10-08: lila-gif/push/engine were not part of the lila upgrade; 1.95 would rebuild them
    working_dir: /lila-gif
    entrypoint: cargo run -- --bind 0.0.0.0:6175
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    ports:
      # 2026-09-13: loopback-bound. Published on 0.0.0.0 these were internet-reachable
      # (docker DNATs in PREROUTING, bypassing the host's INPUT DROP policy). Every
      # consumer addresses this service by its docker service name, never the host port.
      - 127.0.0.1:6175:6175
    volumes:
      - ./repos/lila-gif:/lila-gif
    profiles:
      - gifs
  lila_push:
    image: rust:1.89.0-trixie  # kept at 1.89 on 2026-10-08: lila-gif/push/engine were not part of the lila upgrade; 1.95 would rebuild them
    working_dir: /lila-push
    entrypoint: cargo run --release -- --vapid private.pem --vapid-subject mailto:system@chesspuertoricocoffee.com --bind 0.0.0.0:9054
    restart: unless-stopped
    user: ${USER_ID:-}:${GROUP_ID:-}
    ports:
      # 2026-09-13: loopback-bound. Published on 0.0.0.0 these were internet-reachable
      # (docker DNATs in PREROUTING, bypassing the host's INPUT DROP policy). Every
      # consumer addresses this service by its docker service name, never the host port.
      - 127.0.0.1:9054:9054
    volumes:
      - ./repos/lila-push:/lila-push
      - ./conf/private.pem:/lila-push/private.pem
    profiles:
      - push
  picfit:
    build:
      context: docker
      dockerfile: picfit.Dockerfile
    # 2026-10-02: NO host port. lila (memo.picfit.endpointPost = http://picfit:3001) and Caddy
    # (/display* -> picfit:3001) reach picfit over lila-network only. The old 127.0.0.1:3001
    # publication collided with chess-contact.service, which owns 127.0.0.1:3001 on the host
    # (nginx /api/contact -> 127.0.0.1:3001 is the CONTACT API, not picfit).
    restart: unless-stopped
    volumes:
      - ./conf/picfit.json:/mnt/config.json
      - ./docker/assets:/uploads
    profiles:
      - thumbnails
  mailpit:
    image: axllent/mailpit:v1.27.7
    restart: unless-stopped
    ports:
      # 2026-09-13: loopback-bound. Published on 0.0.0.0 these were internet-reachable
      # (docker DNATs in PREROUTING, bypassing the host's INPUT DROP policy). Every
      # consumer addresses this service by its docker service name, never the host port.
      - 127.0.0.1:8025:8025
    profiles:
      - email
  mongo_express_primary:
    image: mongo-express:1.0.2-20-alpine3.19
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb
    profiles:
      - mongo-express
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./conf/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    profiles:
      - monitoring
  influxdb:
    image: influxdb:2.7.12-alpine
    restart: unless-stopped
    ports:
      - 8086:8086
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=secret
      - DOCKER_INFLUXDB_INIT_ORG=lila-docker
      - DOCKER_INFLUXDB_INIT_BUCKET=kamon
    profiles:
      - monitoring

networks:
  default:
    name: lila-network
    driver: bridge

volumes:
  # Recovery 2026-05-25: pin mongodb /data/db to the real data volume.
  # Previously /data/db was an anonymous volume (mongo image VOLUME), so each
  # container recreation (reboot / compose up) grabbed a fresh EMPTY volume and
  # orphaned the real data. external:true => compose never creates/deletes it,
  # and it survives even `down -v`.
  mongo_data_primary:
    external: true
    name: lila_mongo_data_primary_20260913

  # Pinned 2026-09-13: redis /data was an UNDECLARED anonymous volume (redis image
  # VOLUME), so every container recreation swapped it for a fresh empty one and
  # orphaned the old — the same trap as mongodb above. external:true pins it to the
  # volume currently in use and stops compose ever creating or deleting it.
  redis_data:
    external: true
    name: 9ecacfab0339b71f9a366529ef533ea92a6706a8e2578e38e12748b3106c0a25

  # upstream 2026: local opening explorer (opt-in profile "explorer", see the service)
  openingexplorer-data:
