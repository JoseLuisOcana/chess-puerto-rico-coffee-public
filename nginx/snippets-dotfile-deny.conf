# dotfile-deny.conf - included from every server block of the chesspuertoricocoffee.com vhost.
#
# Denies dotfiles and dot-directories (.env .git .aws .ssh .htpasswd .DS_Store .npmrc ...)
# while leaving /.well-known/ reachable. The negative lookahead is load-bearing: ACME HTTP-01
# tokens live under /.well-known/acme-challenge/, and blocking them would break TLS renewals.
#
# A server-level `if` (not a `location`) on purpose: it runs in the server-rewrite phase,
# BEFORE location selection, so it cannot lose nginx's "first matching regex location" race
# against e.g. a PHP or static-file regex location. `return` is safe inside `if`.
#
# Uses $uri (normalized + percent-decoded), not $request_uri, so encoded probes such as
# /%2eenv or /.%65nv are denied too.
#
# Do not add `access_log off;` - denied probes are meant to stay in the access log.
#
# (Public copy: host-specific operational notes removed; the rule below is byte-identical
#  to the deployed file.)

if ($uri ~ "/\.(?!well-known)") {
    return 403;
}
