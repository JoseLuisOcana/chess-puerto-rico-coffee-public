# --- Block aggressive AI/scraper bots ---
# 2026-10-02 (fix item 10): GPTBot, ClaudeBot, PerplexityBot moved OUT of this hard block - robots.txt
# allows them; they are now served but rate-limited (see /etc/nginx/conf.d/chess-ratelimit.conf).
if ($http_user_agent ~* (meta-externalagent|anthropic-ai|CCBot|Bytespider|FacebookBot|Amazonbot)) {
    return 403;
}

# 2026-10-02 (fix item 5): lila's generic default description -> per-page $chess_desc (set in the vhost).
# One rule covers both <meta name=description> and the homepage's og:description.
sub_filter 'content="Free online chess server. Play chess in a clean interface. No registration, no ads, no plugin required. Play chess with the computer, friends or random opponents."' 'content="$chess_desc"';
# 2026-10-02 (fix item 5): the old '</head>' injection (2nd description, og:title, og:url hardcoded to
# the homepage) is gone. OG is injected ONLY where lila emits none: there `notranslate"><link` is adjacent;
# on pages with native OG, `notranslate"><meta property="og:title"` follows instead, so this never matches.
sub_filter 'content="notranslate"><link ' 'content="notranslate"><meta property="og:title" content="$chess_ogtitle" />$chess_og_url_tag<meta property="og:type" content="website" /><meta property="og:site_name" content="Chess Puerto Rico Coffee" /><link ';
sub_filter_once off;
proxy_set_header Accept-Encoding "";
proxy_hide_header Content-Security-Policy;
# 2026-10-02 (fix item 11): CSP in REPORT-ONLY mode (never enforced; lila's own <meta> CSP stays
# renamed to X-Disabled-CSP above). lila only emits CSP as a per-page <meta> with a per-request
# script nonce nginx cannot see, so this is the UNION of lila's per-page policies (38 pages
# sampled) with the nonce replaced by 'unsafe-inline' - otherwise every page would report lila's
# own nonce'd inline scripts. Violations appear in the browser console only (no report-uri).
add_header Content-Security-Policy-Report-Only "default-src 'self' chesspuertoricocoffee.com; connect-src 'self' blob: data: chesspuertoricocoffee.com wss://chesspuertoricocoffee.com ws://chesspuertoricocoffee.com https://explorer.lichess.ovh https://tablebase.lichess.ovh http://127.0.0.1:3000 http://localhost:8666 http://localhost:9666 www.chessdb.cn en.wikibooks.org https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' chesspuertoricocoffee.com https://hcaptcha.com https://*.hcaptcha.com; frame-src 'self' chesspuertoricocoffee.com www.youtube.com www.youtube-nocookie.com player.twitch.tv player.vimeo.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' chesspuertoricocoffee.com blob:; img-src 'self' blob: data: *; media-src 'self' blob: chesspuertoricocoffee.com; script-src 'unsafe-inline' 'self' chesspuertoricocoffee.com 'unsafe-eval' https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' chesspuertoricocoffee.com data:; base-uri 'none'" always;

sub_filter 'http-equiv="Content-Security-Policy"' 'http-equiv="X-Disabled-CSP"';
sub_filter 'lila-quick' 'Chess Puerto Rico Coffee';
sub_filter '>lila<' '>Chess Puerto Rico Coffee<';
sub_filter 'lila • Free Online Chess' 'Chess Puerto Rico Coffee • Free Online Chess';
sub_filter '<title> lila' '<title> Chess Puerto Rico Coffee';
sub_filter '>lichess.org<' '>ChessPuertoRicoCoffee.com<';
sub_filter 'lichess.org</a>' 'ChessPuertoRicoCoffee.com</a>';
sub_filter 'content="lichess.org"' 'content="Chess Puerto Rico Coffee"';
sub_filter 'content="lichess"' 'content="Chess Puerto Rico Coffee"';
sub_filter 'lichess-tile-wide.png' 'lichess-favicon-512.png';
sub_filter '<!-- Lichess is open source! See https://lichess.org/source -->' '';
# 2026-10-02 (fix item 11): sponsor bar + AGPL footer markup only - all styling now lives in
# /prcoffee/branding.css (linked from the '</head>' rule below), so no inline style attributes.
sub_filter '</body>' '<div id="prcoffe-sponsor"><div class="prc-sp-g1"><span class="prc-sp-i1">☕</span><span class="prc-sp-label">Proudly Sponsored By</span></div><a href="https://puertoricocoffeeshop.com" target="_blank" rel="noopener">PuertoRicoCoffeeShop.com</a><div class="prc-sp-g2"><span class="prc-sp-i2">♞</span><span class="prc-sp-free">100% FREE FOREVER</span></div></div><div class="prc-agpl">This site is a modified version of <a href="https://lichess.org" target="_blank" rel="noopener">Lichess</a>, licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>. Complete modified source code: <a href="https://github.com/JoseLuisOcana/chess-puerto-rico-coffee-public" target="_blank" rel="noopener">github.com/JoseLuisOcana/chess-puerto-rico-coffee-public</a>. Sponsored by <a href="https://www.puertoricocoffeeshop.com" target="_blank" rel="noopener">PuertoRicoCoffeeShop.com</a>.</div></body>';
sub_filter 'noindex, nofollow' 'index, follow';
sub_filter '<a href="/faq">FAQ</a><a href="/contact">Contact</a><a href="/mobile">Mobile App</a><a href="/terms-of-service">Terms of Service</a><a href="/privacy">Privacy</a><a href="/source">Source Code</a><a href="/ads">Ads</a><div class="connect-links"><a href="https://mastodon.online/@lichess" target="_blank" rel="nofollow me">Mastodon</a><a href="https://github.com/lichess-org" target="_blank" rel="nofollow">GitHub</a><a href="https://discord.gg/lichess" target="_blank" rel="nofollow">Discord</a><a href="https://bsky.app/profile/lichess.org" target="_blank" rel="nofollow">Bluesky</a><a href="https://youtube.com/@LichessDotOrg" target="_blank" rel="nofollow">YouTube</a><a href="https://www.twitch.tv/lichessdotorg" target="_blank" rel="nofollow">Twitch</a></div>' '<a href="/terms-of-service">Terms of Service</a><a href="/privacy">Privacy</a><div class="connect-links"><a href="https://puertoricocoffeeshop.com" target="_blank">PuertoRicoCoffeeShop.com</a></div>';
sub_filter 'All updates »' '';
sub_filter '>Donate</strong><span>Become a Lichess Patron<' '>Puzzle of the Day</strong><span>Sharpen your tactics<';
sub_filter '>Swag Store</strong><span>Play chess in style<' '>Live Games</strong><span>Watch games in progress<';
sub_filter 'href="/patron"' 'href="/training"';
sub_filter 'href="/swag"' 'href="/tv"';
sub_filter 'content="The best free, adless Chess server"' 'content="Chess Puerto Rico Coffee - Free Online Chess"';
sub_filter 'Lichess features' 'Chess Puerto Rico Coffee Features';
sub_filter 'Lichess is a free' 'Chess Puerto Rico Coffee is a free';
sub_filter '>Lichess TV<' '>Live TV<';
sub_filter 'Lichess streamers' 'Chess Puerto Rico Coffee Streamers';
sub_filter '>Lichess Patron<' '>Chess Puerto Rico Coffee<';

# Page title suffix (catches "Players • lila", "Forum • lila", etc.)
sub_filter '• lila</title>' '• Chess Puerto Rico Coffee</title>';

# Forum page branding
sub_filter '>Lichess Forum<' '>Chess Puerto Rico Coffee Forum<';
sub_filter 'Lichess community forum' 'Chess Puerto Rico Coffee Forum';
sub_filter 'feedback about Lichess development' 'feedback about Chess Puerto Rico Coffee';
sub_filter 'Lichess Updates Feed' 'Chess Puerto Rico Coffee Updates Feed';
sub_filter 'title="Lichess Mod"' 'title="Moderator"';

# Coach page branding
sub_filter 'Lichess coaches' 'Chess Puerto Rico Coffee Coaches';
sub_filter '>Lichess rating<' '>Rating<';

# Streamer page — replace lichess blog link with edit page
# Streamer page — hide dead "Download streamer kit" link (no kit page exists on this fork)
sub_filter '<a href="/about">Download streamer kit</a>' '';
sub_filter 'href="/blog/Wk5z0R8AACMf6ZwN/join-the-lichess-streamer-community">Streamer community</a>' 'href="/streamer/edit">Become a streamer</a>';

# Tournament page branding
sub_filter '>Lichess tournaments<' '>Scheduled Tournaments<';
sub_filter 'Lichess Anniversary' 'Anniversary';

# Catch-all for remaining "Lichess" in visible text contexts
sub_filter '>Lichess<' '>Chess Puerto Rico Coffee<';

# --- 2026-10-02 (fix item 6a): branding fixes. Patterns are written against the RAW lila HTML
# and deliberately START EARLIER than the generic rules they must beat (sub_filter takes the
# match that starts first) - e.g. the FAQ "lila" repo link vs the catch-all '>lila<'.
# Nav: drop the two Donate slots (they used to be rewritten into a 3rd and 4th "Puzzles").
sub_filter '<a class="community-patron mobile-only" href="/patron">Donate</a>' '';
sub_filter '<a class="site-title-nav__donate" href="/patron"><span>Donate</span></a>' '';
# Header: the "Play" / "lichess.org" spans had no space, so text read "PlayChessPuertoRicoCoffee.com".
sub_filter '<span class="play">Play</span><span class="home">lichess.org</span>' '<span class="play">Play</span> <span class="home">Chess Puerto Rico Coffee</span>';
# About links: 3 upstream contexts. Only the two homepage ones get a Contact link; the side menu
# already has lila's own Contact (rewritten to /contact-us below), so no duplicate.
sub_filter 'open source chess server. <a href="/about">About Lichess...</a>' 'open source chess server. <a href="/contact-us">Contact</a><a href="/about">About Chess PR Coffee</a>';
sub_filter '<div class="lobby__about"><a href="/about">About Lichess</a>' '<div class="lobby__about"><a href="/contact-us">Contact</a><a href="/about">About Chess PR Coffee</a>';
sub_filter 'page-menu__menu"><a href="/about">About lichess.org</a>' 'page-menu__menu"><a href="/about">About Chess PR Coffee</a>';
sub_filter 'href="/contact"' 'href="/contact-us"';
sub_filter '>Lichess updates<' '>News<';
sub_filter 'Is Lichess lagging?' 'Is the site lagging?';
sub_filter 'Lichess tactic trainer' 'Chess Puerto Rico Coffee tactic trainer';
sub_filter 'Lichess community blogs' 'Community blogs';
# FAQ: protect the upstream repo name from the catch-all '>lila<', which produced
# "the source code for Lichess, Chess Puerto Rico Coffee, stands for li[chess in sca]la".
sub_filter '<a href="https://github.com/lichess-org/lila">lila</a>' '<a href="https://github.com/lichess-org/lila">lila</a>';
# FAQ "How can I contribute to Lichess?": its patron/costs/contribute links hit routes that
# 301/404 on this fork; point them at the upstream project the answer is about.
sub_filter '<p>You can find out more about <a href="/patron">being a patron</a> (including a <a href="/costs">breakdown of our costs</a>). If you want to help Lichess by volunteering your time and skills, there are many <a href="/help/contribute">other ways to help</a>.</p>' '<p>You can support the original Lichess project by <a href="https://lichess.org/patron" target="_blank" rel="noopener">becoming a Lichess patron</a> (see their <a href="https://lichess.org/costs" target="_blank" rel="noopener">breakdown of costs</a>). If you want to help Lichess by volunteering your time and skills, there are many <a href="https://lichess.org/help/contribute" target="_blank" rel="noopener">other ways to help</a>.</p>';
# Permissions-Policy: lila's header names https://lichess1.org (the upstream asset CDN).
proxy_hide_header Permissions-Policy;
add_header Permissions-Policy "screen-wake-lock=(self), microphone=(self), fullscreen=(self)" always;
# 2026-10-02 (fix item 8): homepage-only Organization + WebSite JSON-LD ($chess_jsonld is empty elsewhere).
# 2026-10-02 (fix item 11): + the site branding stylesheet (bump ?v= when branding.css changes).
sub_filter '</head>' '$chess_jsonld<link rel="stylesheet" href="/prcoffee/branding.css?v=20261002"></head>';

