# /etc/nginx/snippets/chess-security-headers.conf - BUTTON 260 (2026-11-26, owner; Codex review item 08)
# The two security headers the chess site did not send. Included at server level of the chess HTTPS server, in every location there that
# has its own add_header, and in chess-branding.conf (nginx does not inherit add_header into a block that has its own).
# X-Frame-Options comes from the map $chess_frame_options (conf.d/chess-security-headers-map.conf): SAMEORIGIN, and NOT sent on lila's
# pages that are made to be embedded on other sites. CSP stays REPORT-ONLY (chess-branding.conf) - owner 2026-11-26.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $chess_frame_options always;
