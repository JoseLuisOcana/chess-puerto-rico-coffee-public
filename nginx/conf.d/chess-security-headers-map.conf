# /etc/nginx/conf.d/chess-security-headers-map.conf - BUTTON 260 (2026-11-26, owner; Codex review item 08). http context.
# 1) X-Frame-Options for the chess site (snippets/chess-security-headers.conf): SAMEORIGIN, except lila's embeddable pages
#    (an empty value = nginx sends no header): /embed/..., /study/embed/..., /tv/frame, /tv/<channel>/frame, /training/frame.
map $uri $chess_frame_options {
    default                 "SAMEORIGIN";
    ~^/embed/               "";
    ~^/study/embed/         "";
    ~^/tv/frame$            "";
    ~^/tv/[^/]+/frame$      "";
    ~^/training/frame$      "";
}
# 2) a simple bot check on sign-up, no third party: a POST to /signup must carry the cookie prc_su=1, which /prcoffee/signup-check.js sets
#    in the browser only after the page has been open 3 seconds with the hidden "website" field (a honeypot people never see) empty.
#    1 = refuse (the chess vhost sends it back to the form: 303 /signup?check=1, nothing reaches lila). GET /signup and every other address: 0.
map "$request_method:$uri:$cookie_prc_su" $chess_signup_blocked {
    default                 0;
    "POST:/signup:1"        0;
    ~^POST:/signup:         1;
}
