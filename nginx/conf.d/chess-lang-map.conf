# chess-lang-map.conf (2026-10-08; ENGLISH FIRST since BUTTON 249, 2026-11-26): the language of chesspuertoricocoffee.com.
# lila picks its language from the account setting, then its own session (lila's language menu), then Accept-Language; it has
# no ?lang= parameter. So for lila pages nginx sets the Accept-Language it forwards (vhost: proxy_set_header Accept-Language),
# and our own static pages (/about, /faq, /contact-us, /privacy, /terms-of-service and /es/...) choose English or Spanish
# from the same choice. The choice is remembered for a year in the cookie "prclang" (no personal data; SameSite=Lax, Secure).
# Also loaded by the staging nginx (/opt/chess/lila-staging/nginx/staging.conf): keep the variable names.
#
# BUTTON 249 (owner, 2026-11-26: "ENGLISH FIRST: the whole site opens in English for everyone, even with a Spanish browser.
# Spanish shows only when a visitor picks it"). The browser's own Accept-Language is NO LONGER used. In order:
#   1. ?lang=es / ?lang=en (any case; anything else, also an empty ?lang=, counts as no choice) - the language switch
#   2. a language address of lila: /es, /es/training, /es/video/<id>, /de/study ... (every lila page that starts with a
#      language code): that language - an explicit address, like our static /es/... pages
#   3. the remembered choice: cookie prclang=es|en, set by ?lang= AND by lila's own language menu (vhost: /translation/select;
#      the menu also sends the visitor back WITHOUT a language prefix and without ?lang=, so the menu's choice decides there)
#   4. otherwise ENGLISH
# A logged-in member's language setting and lila's own session still win inside lila (lila's rule); nginx cannot see them.

# the language switch and the remembered choice, normalized once (exactly es or en, else ""). String keys of a map match whole
# values, case-insensitively: "ES" -> es; "es|x", "fr", "" -> "".
map $arg_lang $prc_arg {
    es      es;
    en      en;
    default "";
}
map $cookie_prclang $prc_ck {
    es      es;
    en      en;
    default "";
}
# ?lang= or the remembered choice (es|en or empty): used by the static pages
map "$prc_arg|$prc_ck" $prc_lang {
    "~^(?<l1>es|en)\|"  $l1;     # ?lang=es|en wins
    "~^\|(?<l2>es|en)$" $l2;     # else the remembered choice
    default             "";
}
# lila's language addresses: /<xx> and /<xx>/... (conf/routes: every "/$lang<\w\w\w?>/..." route - home, tv, training, video,
# coach, learn, login, signup ...). <xx> = the 91 language codes of lila's modules/i18n/src/main/LangList.scala (lila prcoffee
# 09f461c); none of them is the first part of any other lila address. A language that a future lila adds is English here until it
# is added to this list (its address then redirects to the English page).
map $uri $prc_path_lang {
    "~^/(?<pl>af|an|ar|ast|av|az|be|bg|bn|br|bs|ca|ckb|co|cs|cv|cy|da|de|el|en|eo|es|et|eu|fa|fi|fo|fr|fy|ga|gd|gl|gsw|gu|he|hi|hr|hu|hy|ia|id|is|it|ja|jbo|ka|kab|kk|kmr|kn|ko|la|lb|lt|lv|mg|mk|ml|mn|mr|nb|ne|nl|nn|pi|pl|ps|pt|ro|ru|ry|sk|sl|so|sq|sr|sv|sw|ta|th|tk|tl|tok|tr|uk|ur|uz|vi|zh|zu)(/|$)" $pl;
    default "";
}
# the language lila renders (rules 1-4 above). Key = switch | path language | remembered - all three normalized above.
map "$prc_arg|$prc_path_lang|$prc_ck" $prc_lang_eff {
    "~^(?<e1>es|en)\|"            $e1;    # 1. ?lang=es / ?lang=en
    "~^\|(?<e2>[a-z]+)\|"         $e2;    # 2. a language address
    "~^\|\|(?<e3>es|en)$"         $e3;    # 3. the remembered choice
    default                       "";     # 4. English
}
map $prc_lang_eff $prc_accept_language {
    ""      "en-US,en;q=0.9";
    es      "es-ES,es;q=0.9";
    en      "en-US,en;q=0.9";
    default $prc_lang_eff;               # another language address (/de, /fr/training ...): that language
}
map $prc_arg $prc_lang_cookie {
    es      "prclang=es; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    en      "prclang=en; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    default "";
}
# lila's language menu (POST /translation/select, form field lang=<code>, e.g. lang=es-ES; lila answers 303 to the page the
# visitor came from). Only on that 303: remember the choice like ?lang= - Spanish for es / es-XX, English for any other language
# (lila's own session then shows that language on lila pages; the static pages exist only in English and Spanish). Read from the
# small form body (vhost: client_body_in_single_buffer). A percent-encoded value (lang=%65s) is not recognized: no cookie.
map "$upstream_status|$request_body" $prc_menu_cookie {
    "~^303\|(.*&)?lang=es(-[A-Za-z]{2,4})?(&|$)"  "prclang=es; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    "~^303\|(.*&)?lang=[A-Za-z]{2,3}(-[A-Za-z]{2,4})?(&|$)"  "prclang=en; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    default "";
}
# ... and its 303 goes back to that page WITHOUT a language prefix and without its query when that has a lang= argument
# (/es/training?lang=es -> /training; /blog/community?page=2 stays), so the
# menu's choice decides the language there (lila's own Location, absolute or relative; anything else is left as it is).
map $upstream_http_location $prc_menu_loc1 {
    "~^(?<mla>(https://chesspuertoricocoffee\.com)?)/(af|an|ar|ast|av|az|be|bg|bn|br|bs|ca|ckb|co|cs|cv|cy|da|de|el|en|eo|es|et|eu|fa|fi|fo|fr|fy|ga|gd|gl|gsw|gu|he|hi|hr|hu|hy|ia|id|is|it|ja|jbo|ka|kab|kk|kmr|kn|ko|la|lb|lt|lv|mg|mk|ml|mn|mr|nb|ne|nl|nn|pi|pl|ps|pt|ro|ru|ry|sk|sl|so|sq|sr|sv|sw|ta|th|tk|tl|tok|tr|uk|ur|uz|vi|zh|zu)(?<mlc>\?.*)?$"  "$mla/$mlc";
    "~^(?<mla>(https://chesspuertoricocoffee\.com)?)/(af|an|ar|ast|av|az|be|bg|bn|br|bs|ca|ckb|co|cs|cv|cy|da|de|el|en|eo|es|et|eu|fa|fi|fo|fr|fy|ga|gd|gl|gsw|gu|he|hi|hr|hu|hy|ia|id|is|it|ja|jbo|ka|kab|kk|kmr|kn|ko|la|lb|lt|lv|mg|mk|ml|mn|mr|nb|ne|nl|nn|pi|pl|ps|pt|ro|ru|ry|sk|sl|so|sq|sr|sv|sw|ta|th|tk|tl|tok|tr|uk|ur|uz|vi|zh|zu)(?<mlb>/[^?]*)(?<mlc>\?.*)?$"  "$mla$mlb$mlc";
    default $upstream_http_location;
}
map $prc_menu_loc1 $prc_menu_location {
    "~*^(?<mlp>[^?]*)\?(.*&)?lang="  "$mlp";   # any lang= argument (any case, any number): the whole query goes - the menu's choice decides
    default $prc_menu_loc1;
}
# static pages: Spanish only when the choice is es (?lang=es or prclang=es); the browser's language is not used (BUTTON 249)
map $prc_lang $prc_static_es {
    es          1;
    default     0;
}
