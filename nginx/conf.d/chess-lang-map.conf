# chess-lang-map.conf (2026-10-08; English first since BUTTON 249; ENGLISH ONLY since BUTTON 254, 2026-11-26).
# Owner 2026-11-26: "the chess site is ENGLISH ONLY. Every page, for every visitor, in English. No Spanish or other languages."
# - lila is always told English (vhost: proxy_set_header Accept-Language $prc_accept_language), whatever the browser, ?lang= or a
#   cookie says. lila's language menu is answered by nginx itself (vhost: location = /translation/select -> 204, nothing saved).
# - lila's language addresses (/es, /es/training, /de/study ... - the 91 codes of lila's LangList) -> 301 to the same page without
#   the prefix ($prc_lang_target below; vhost: the language-address location). Our static /es/ pages -> 301 to the English page.
# - Also loaded by the staging nginx (/opt/chess/lila-staging/nginx/staging.conf + its vhost_nginx.conf), which uses
#   $prc_accept_language, $prc_lang_cookie and $prc_static_es: keep these 3 names (now constants: English, no cookie, never Spanish).
map $host $prc_accept_language {
    default "en-US,en;q=0.9";
}
map $host $prc_lang_cookie {
    default "";
}
map $host $prc_static_es {
    default 0;
}
# The 301 target for a lila language address, built from the RAW request line ($request_uri is never percent-decoded, so an encoded
# name like /es/video/author/Some%20Name keeps its %20, and no CR/LF can reach the Location header). Only plain URL characters are
# accepted; anything else gives "" and the vhost sends the visitor to the homepage. Any case (/ES/training too). The query is kept.
# A language that a future lila adds is not in this list: its address then reaches lila, which redirects it itself (English).
# Our Spanish static pages, any case, with or without a trailing / -> the exact English page (vhost: location ~* ^/es/(...)/?$)
map $uri $prc_es_static_target {
    "~*^/es/about/?$"             /about;
    "~*^/es/faq/?$"               /faq;
    "~*^/es/contact-us/?$"        /contact-us;
    "~*^/es/privacy/?$"           /privacy;
    "~*^/es/terms-of-service/?$"  /terms-of-service;
    default                       /;
}
map $request_uri $prc_lang_target {
    "~*^/(?:af|an|ar|ast|av|az|be|bg|bn|br|bs|ca|ckb|co|cs|cv|cy|da|de|el|en|eo|es|et|eu|fa|fi|fo|fr|fy|ga|gd|gl|gsw|gu|he|hi|hr|hu|hy|ia|id|is|it|ja|jbo|ka|kab|kk|kmr|kn|ko|la|lb|lt|lv|mg|mk|ml|mn|mr|nb|ne|nl|nn|pi|pl|ps|pt|ro|ru|ry|sk|sl|so|sq|sr|sv|sw|ta|th|tk|tl|tok|tr|uk|ur|uz|vi|zh|zu)(?<plq>\?[A-Za-z0-9._~!&'()*+,;=:@%/?-]*)?$"  "/$plq";
    "~*^/(?:af|an|ar|ast|av|az|be|bg|bn|br|bs|ca|ckb|co|cs|cv|cy|da|de|el|en|eo|es|et|eu|fa|fi|fo|fr|fy|ga|gd|gl|gsw|gu|he|hi|hr|hu|hy|ia|id|is|it|ja|jbo|ka|kab|kk|kmr|kn|ko|la|lb|lt|lv|mg|mk|ml|mn|mr|nb|ne|nl|nn|pi|pl|ps|pt|ro|ru|ry|sk|sl|so|sq|sr|sv|sw|ta|th|tk|tl|tok|tr|uk|ur|uz|vi|zh|zu)(?<plp>/[A-Za-z0-9._~!&'()*+,;=:@%/-]*)(?<plq>\?[A-Za-z0-9._~!&'()*+,;=:@%/?-]*)?$"  "$plp$plq";
    default "";
}
