# chess-lang-map.conf (2026-10-08): ?lang=es / ?lang=en for chesspuertoricocoffee.com.
# lila picks its language from the account setting, then its own session, then Accept-Language; it has no ?lang= parameter.
# So for lila pages nginx rewrites the Accept-Language it forwards (vhost: proxy_set_header Accept-Language), and our own
# static pages (/about, /faq, /contact-us and /es/...) choose English or Spanish from the same signal. A ?lang= choice is
# remembered for a year in the cookie "prclang" (no personal data; SameSite=Lax, Secure).
map "$arg_lang|$cookie_prclang" $prc_lang {
    "~^(?<l1>es|en)\|"  $l1;     # ?lang=es|en wins
    "~^\|(?<l2>es|en)$" $l2;     # else the remembered choice
    default             "";
}
map $prc_lang $prc_accept_language {
    es      "es-ES,es;q=0.9";
    en      "en-US,en;q=0.9";
    default $http_accept_language;
}
map $arg_lang $prc_lang_cookie {
    es      "prclang=es; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    en      "prclang=en; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    default "";
}
# static pages: Spanish when the choice is es, or with no choice when the browser's FIRST language is Spanish
map "$prc_lang|$http_accept_language" $prc_static_es {
    "~^es\|"    1;
    "~^en\|"    0;
    "~*^\|es"   1;
    default     0;
}
