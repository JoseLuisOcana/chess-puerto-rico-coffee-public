# /etc/nginx/conf.d/chess-security-blocks.conf - BUTTON 235 (2026-11-24, owner): a block for chesspuertoricocoffee.com
# that stays while lila runs in DEV mode. Undo: PANIC-BUTTONS BUTTON 237 first, then BUTTON 235.
# Read ONLY by a server-level `if` in the chess :443 vhost (and its pre-staging vhost_nginx.conf); http context,
# so the other sites never use it.
#
# 1. REMOVED 2026-11-25 (BUTTON 237, owner): the Puzzle Racer websocket block (GHSA-2rpf-mmrc-v68p, a racer socket opened
#    with a TEAM id read that team's members-only chat). The fix (lila-ws 257e811 + lila 1f25f6a) is live since
#    2026-11-25 (BUTTON 236), so Puzzle Racer can be played again.
# 2. GHSA-582f-w2m6-pr6m (Medium): a broadcast's source URL makes our server fetch it (blind SSRF to internal
#    addresses). The upstream fix only acts in production mode and this lila runs in DEV mode, so the upgrade does NOT
#    fix it here: every write (any method but GET/HEAD) under /broadcast/, /api/broadcast/ and /upload/image/broadcast/
#    is refused - nobody can create or edit a broadcast. Viewing is unaffected (no broadcasts exist, 2026-11-24).
#
# $uri is the normalized, percent-decoded path (so /%72acer/1 and //racer/1 are caught too). In a map, regular
# expressions are tried in the order written; the first match wins.
map "$request_method|$uri" $chess_block_broadcast_write {
    default 0;
    "~^(GET|HEAD)\|" 0;
    "~^[^|]*\|/(api/)?broadcast(/|$)" 1;
    "~^[^|]*\|/upload/image/broadcast/" 1;
}
