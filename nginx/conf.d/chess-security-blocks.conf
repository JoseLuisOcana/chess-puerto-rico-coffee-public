# /etc/nginx/conf.d/chess-security-blocks.conf - BUTTON 235 (2026-11-24, owner): two TEMPORARY blocks for
# chesspuertoricocoffee.com until the lila / lila-ws upgrade. Undo: PANIC-BUTTONS BUTTON 235.
# Read ONLY by two server-level `if`s in the chess :443 vhost (and its pre-staging vhost_nginx.conf); http context,
# so the other sites never use them.
#
# 1. GHSA-2rpf-mmrc-v68p (High): our lila-ws (the 2026-10-06 image) does not check the id of a Puzzle Racer socket, and
#    a racer id can be a TEAM id - anyone could read that team's members-only chat. Fixed upstream 2026-11-22 (lila-ws
#    257e811 + lila 1f25f6a, they go together). Until then every websocket upgrade to /racer/... is refused, so Puzzle
#    Racer cannot be played (the /racer page still loads). Caddy sends EVERY websocket upgrade to lila-ws, whatever the
#    path, so the block must sit in front of it.
# 2. GHSA-582f-w2m6-pr6m (Medium): a broadcast's source URL makes our server fetch it (blind SSRF to internal
#    addresses). The upstream fix only acts in production mode and this lila runs in DEV mode, so the upgrade does NOT
#    fix it here: every write (any method but GET/HEAD) under /broadcast/, /api/broadcast/ and /upload/image/broadcast/
#    is refused - nobody can create or edit a broadcast. Viewing is unaffected (no broadcasts exist, 2026-11-24).
#
# $uri is the normalized, percent-decoded path (so /%72acer/1 and //racer/1 are caught too). In a map, regular
# expressions are tried in the order written; the first match wins.
map "$http_upgrade|$uri" $chess_block_racer_ws {
    default 0;
    "~*^[^|]*websocket[^|]*\|/racer(/|$)" 1;
}
map "$request_method|$uri" $chess_block_broadcast_write {
    default 0;
    "~^(GET|HEAD)\|" 0;
    "~^[^|]*\|/(api/)?broadcast(/|$)" 1;
    "~^[^|]*\|/upload/image/broadcast/" 1;
}
