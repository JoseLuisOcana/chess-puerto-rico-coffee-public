# BUTTON 261 (chess, 2026-11-26, owner): quick protection until lila + lila-ws are upgraded (upstream fixes: lila c45261e,
# lila-ws bee9229). Used by ONE server-level `if` in the chess :443 server (/etc/nginx/plesk.conf.d/vhosts/chesspuertoricocoffee.com.conf):
# $chess_advisory_refuse = 1 -> 400. Remove it only with BUTTON 261's undo (which takes the `if` out first), never by hand.
#
# 1. hook_like: the lobby page puts this query value into a request path; the only legitimate value is a game id (8 letters /
#    digits: lila's own "new opponent" link is /?hook_like=<game id>). The browser decodes parameter NAMES (URLSearchParams), so
#    every percent-encoded spelling of the name counts; nginx's $arg_* cannot see those, so the whole raw $request_uri is matched.
#    The browser splits the query ONLY on '&': a valid id must be followed by '&' or the end (';' or '#' after it = refused).
# 2. sri: lila-ws takes the socket id from the query (Netty QueryStringDecoder: names decoded, '&' and ';' separate, a '#' with no
#    '?' before it starts the parameters, the first value wins). Real ids are 12 characters of [A-Za-z0-9_] (lila's randomToken).
#    A value that is not 1-32 characters of [A-Za-z0-9_-] (a space, '+', a comma, any %-escape, empty) is refused, for EVERY
#    occurrence of the name; it must be followed by '&' or the end (not ';' / '#'). Netty skips '=' signs at the start of a field
#    ('?=sri=...' is the parameter sri), so any '=' signs before the name are allowed for in both rules (Codex review 261-02).
# 3. lila-ws also takes the socket id from a "Lichess Mobile/..." User-Agent (the query is not used then). No Lichess Mobile app
#    talks to this server, so that User-Agent is refused everywhere. nginx 1.18 reads the FIRST User-Agent line, the same one
#    Caddy (Go) and lila-ws (Netty) use.
# Matching is case-insensitive (letters AND the %-escape of either case of each letter) and treats '?' and '#' inside the query as
# separators too: wider than the browser / Netty (which compare names exactly), so it can only refuse more, never less.
# One regex per key, no backslash escapes except \s.
map $request_uri $chess_adv_query {
    default 0;
    "~*^[^?#]*[?#](?:.*[&;#?])?=*(?:h|%68|%48)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:_|%5f)(?:l|%6c|%4c)(?:i|%69|%49)(?:k|%6b|%4b)(?:e|%65|%45)(?=[=&;#]|$)(?!=[a-z0-9]{8}(?:&|$))" 1;
    "~*^[^?#]*[?#](?:.*[&;#?])?=*(?:s|%73|%53)(?:r|%72|%52)(?:i|%69|%49)(?=[=&;#]|$)(?!=[a-z0-9_-]{1,32}(?:&|$))" 2;
}
map $http_user_agent $chess_adv_ua {
    default 0;
    "~*lichess\s*mobile" 3;
}
map "$chess_adv_query:$chess_adv_ua" $chess_advisory_refuse {
    default 1;
    "0:0" 0;
}
