# 2026-10-03 (owner-approved slowness fix 4): server-side TLS session cache for every vhost, so a returning
# visitor's browser resumes its TLS session instead of a full handshake. ~40,000 sessions per 10 MB.
# http context (included from nginx.conf inside http{}). Undo: sudo rm this file && sudo nginx -t && sudo systemctl reload nginx
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 4h;
