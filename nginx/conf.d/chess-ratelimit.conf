# /etc/nginx/conf.d/chess-ratelimit.conf — chesspuertoricocoffee.com ONLY (2026-10-02, fix item 10)
#
# http-context maps + one limit_req zone. Nothing here acts on its own: only the chess vhost
# references $chess_ai_bot_forbidden and zone=chess_ai_bots. `map` is http-only, which is why
# this cannot live in the vhost or vhost_nginx.conf.
#
# The crawlers that robots.txt explicitly allows are SERVED (200), but:
#   - rate-limited to 1 r/s, burst 5, per crawler FAMILY (all its IPs share one bucket - a
#     many-IP crawler is what took lila down on 2026-04-29), excess -> 429;
#   - /assets/ is exempt so rendering a page does not trip the limit;
#   - kept off expensive paths: deep /opening/<name>/<moves>, /games/export, /api/ -> 403.
# Googlebot is deliberately NOT listed (never limited). Hard-blocked bots (meta-externalagent,
# CCBot, Bytespider, ...) stay in the `if` in /etc/nginx/snippets/chess-branding.conf.

map $http_user_agent $chess_ai_bot {
    default              "";
    ~*gptbot             gptbot;
    ~*chatgpt-user       chatgpt-user;
    ~*claudebot          claudebot;
    ~*claude-web         claude-web;
    ~*perplexitybot      perplexitybot;
    ~*google-extended    google-extended;
    ~*applebot-extended  applebot-extended;
    ~*youbot             youbot;
    ~*cohere-ai          cohere-ai;
    ~*bingbot            bingbot;
}

map $uri $chess_heavy_path {
    default                                               0;
    "~^/([a-z]{2,3}(-[A-Za-z]{2,4})?/)?opening/[^/]+/."   1;
    "~^/games/export"                                     1;
    "~^/api/"                                             1;
}

map "$chess_ai_bot:$chess_heavy_path" $chess_ai_bot_forbidden {
    default        0;
    "~^[^:]+:1$"   1;
}

map $uri $chess_static_asset {
    default      0;
    "~^/assets/" 1;
}

map "$chess_static_asset:$chess_ai_bot" $chess_ai_bot_limit_key {
    default                  "";
    "0:gptbot"               gptbot;
    "0:chatgpt-user"         chatgpt-user;
    "0:claudebot"            claudebot;
    "0:claude-web"           claude-web;
    "0:perplexitybot"        perplexitybot;
    "0:google-extended"      google-extended;
    "0:applebot-extended"    applebot-extended;
    "0:youbot"               youbot;
    "0:cohere-ai"            cohere-ai;
    "0:bingbot"              bingbot;
}

# empty key = not limited (every non-listed client, and listed bots on /assets/)
limit_req_zone $chess_ai_bot_limit_key zone=chess_ai_bots:1m rate=1r/s;
