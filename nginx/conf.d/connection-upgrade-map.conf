# WebSocket connection upgrade map — used by chesspuertoricocoffee.com (3 references).
#
# Relocated here from /etc/nginx/nginx.conf on 2026-09-14. That file belongs to the
# nginx-common package, so installing Plesk's sw-nginx (which Conflicts with, and
# therefore removes, nginx-common) would delete the map with it and leave the chess
# vhost referencing an undefined $connection_upgrade -> nginx -t fails -> nginx will
# not start. This file is owned by no package, and both Ubuntu's nginx.conf and
# Plesk's include /etc/nginx/conf.d/*.conf, so it survives the swap.
#
# Same reasoning as chess-noindex-map.conf ($chess_noindex), which already lives here.
# `map` is http-context only, so this CANNOT move into a vhost_nginx.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
